packages:
  - "."

# pnpm 11 reads dependency overrides from the workspace manifest.
overrides:
  postcss: 8.5.25
  sharp: 0.35.3
  esbuild: 0.25.12
  vite: 6.4.3
  js-yaml: 4.3.1
  nanoid: 3.3.17
  brace-expansion@<1.1.18: 1.1.18
  brace-expansion@>=2.0.0 <2.1.4: 2.1.4
  brace-expansion@>=4.0.0 <5.0.9: 5.0.9

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - brace-expansion@1.1.18
  - brace-expansion@2.1.4
  - brace-expansion@5.0.9
  - '@ai-sdk/gateway@4.0.40'
  - '@ai-sdk/openai-compatible@3.0.22'
  - '@ai-sdk/provider-utils@5.0.20'
  - '@ai-sdk/provider@4.0.5'
  - ai@7.0.51
  - js-yaml@4.3.1
  - nanoid@3.3.17
